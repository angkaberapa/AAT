[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pvmbg-mock"
version = "0.1.0"
description = "Mock PVMBG service for IF4031 Milestone 1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Docker Desktop presents files from Windows build contexts as executable.
ignore = ["EXE002"]
