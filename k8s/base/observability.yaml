# Observabilitas M2 (role=other, kelas "Komponen lain" Lampiran B: 128Mi/256Mi).
# Ditulis dengan bantuan LLM (Claude).
#   - Prometheus  : scrape GET /metrics semua pod ber-anotasi prometheus.io/scrape=true (port "http").
#   - Grafana     : dashboard "BNPB - Observabilitas" + datasource Prometheus & Jaeger (provisioned).
#   - Jaeger      : menerima trace OTLP dari service BNPB, UI untuk melihat alur lintas service.
# Konfigurasi OTel untuk service BNPB ada di ConfigMap otel-config (dipasang lewat patch di
# kustomization.yaml ke semua Deployment bnpb-*).
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  # Semua request di-trace (parentbased_always_on). Saat load test besar boleh diturunkan, mis.
  # OTEL_TRACES_SAMPLER=parentbased_traceidratio dan OTEL_TRACES_SAMPLER_ARG=0.05.
  OTEL_TRACES_SAMPLER: parentbased_always_on
---
# ------------------------------------------------------------------------------ Prometheus
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels: { app: prometheus, role: other }
---
# Hanya boleh melihat pod di namespace ini (service discovery), tidak lebih.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  labels: { app: prometheus, role: other }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  labels: { app: prometheus, role: other }
subjects:
  - kind: ServiceAccount
    name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels: { app: prometheus, role: other }
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: bnpb
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [sistem-informasi-kebencanaan-bnpb]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # Satu target per pod: port bernama "http" (tempat /metrics disajikan).
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_pod_phase]
            action: drop
            regex: (Pending|Succeeded|Failed)
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_label_role]
            target_label: role
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: { app: prometheus, role: other }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus, role: other }
    spec:
      serviceAccountName: prometheus
      enableServiceLinks: false
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Data cukup untuk demo/game day; dibatasi supaya muat di limit 256Mi.
            - --storage.tsdb.retention.time=6h
            - --web.enable-lifecycle
          env:
            - { name: GOMEMLIMIT, value: 200MiB }
          ports: [{ containerPort: 9090, name: http }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: { app: prometheus, role: other }
spec:
  type: LoadBalancer
  selector: { app: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
---
# ---------------------------------------------------------------------------------- Jaeger
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels: { app: jaeger, role: other }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger, role: other }
    spec:
      enableServiceLinks: false
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          # Penyimpanan di memori, dibatasi jumlah trace supaya muat di limit 256Mi.
          args: ["--memory.max-traces=5000"]
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
            - { name: GOMEMLIMIT, value: 200MiB }
          ports:
            - { containerPort: 16686, name: ui }
            - { containerPort: 4318, name: otlp-http }
          readinessProbe:
            httpGet: { path: /, port: 14269 }
            periodSeconds: 10
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels: { app: jaeger, role: other }
spec:
  type: LoadBalancer
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: ui }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
# --------------------------------------------------------------------------------- Grafana
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels: { app: grafana, role: other }
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        jsonData: { timeInterval: 5s }
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: bnpb
        folder: BNPB
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: { app: grafana, role: other }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana, role: other }
    spec:
      enableServiceLinks: false
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: GRAFANA_ADMIN_PASSWORD } }
            # Dashboard bisa dilihat tanpa login (demo); mengubah tetap butuh admin.
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/bnpb.json }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
          ports: [{ containerPort: 3000, name: http }]
          volumeMounts:
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 256Mi }
      volumes:
        - name: provisioning
          configMap: { name: grafana-provisioning }
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: { app: grafana, role: other }
spec:
  type: LoadBalancer
  selector: { app: grafana }
  ports: [{ name: http, port: 3000, targetPort: http }]
