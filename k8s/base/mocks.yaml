# Mock BMKG & PVMBG (role=mock). LoadBalancer supaya port M1 (8081/8082) tetap bisa dipakai
# dari host untuk demo admin endpoint (k3s ServiceLB / k3d loadbalancer).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmkg-mock
  labels: { app: bmkg-mock, role: mock }
spec:
  replicas: 1
  selector:
    matchLabels: { app: bmkg-mock }
  template:
    metadata:
      labels: { app: bmkg-mock, role: mock }
    spec:
      enableServiceLinks: false
      containers:
        - name: bmkg-mock
          image: aat/bmkg-mock:dev
          ports: [{ containerPort: 8081, name: http }]
          envFrom: [{ configMapRef: { name: bmkg-mock-config } }]
          env:
            - name: BMKG_API_KEY
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: BMKG_API_KEY } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: bmkg-mock
  labels: { app: bmkg-mock, role: mock }
spec:
  type: LoadBalancer
  selector: { app: bmkg-mock }
  ports: [{ name: http, port: 8081, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvmbg-mock
  labels: { app: pvmbg-mock, role: mock }
spec:
  replicas: 1
  selector:
    matchLabels: { app: pvmbg-mock }
  template:
    metadata:
      labels: { app: pvmbg-mock, role: mock }
    spec:
      enableServiceLinks: false
      containers:
        - name: pvmbg-mock
          image: aat/pvmbg-mock:dev
          ports: [{ containerPort: 8082, name: http }]
          envFrom: [{ configMapRef: { name: pvmbg-mock-config } }]
          env:
            - name: PVMBG_TOKEN
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: PVMBG_TOKEN } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: pvmbg-mock
  labels: { app: pvmbg-mock, role: mock }
spec:
  type: LoadBalancer
  selector: { app: pvmbg-mock }
  ports: [{ name: http, port: 8082, targetPort: http }]
