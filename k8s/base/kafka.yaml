# Kafka KRaft satu broker (role=broker), setara compose M1.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: { app: kafka, role: broker }
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka, role: broker }
    spec:
      # Wajib: image apache/kafka mengubah setiap env KAFKA_* jadi properti broker, dan service
      # link k8s menyuntikkan KAFKA_PORT, KAFKA_SERVICE_HOST, dst. yang membuat broker gagal start.
      enableServiceLinks: false
      securityContext: { fsGroup: 1000 }
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - { containerPort: 9092, name: client }
            - { containerPort: 9093, name: controller }
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms512m -Xmx512m" }
          volumeMounts: [{ name: data, mountPath: /var/lib/kafka/data }]
          readinessProbe:
            tcpSocket: { port: client }
            periodSeconds: 10
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket: { port: client }
            periodSeconds: 20
            initialDelaySeconds: 60
          resources:
            requests: { memory: 512Mi, cpu: 100m }
            limits: { memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: { app: kafka, role: broker }
spec:
  selector: { app: kafka }
  ports: [{ name: client, port: 9092, targetPort: client }]
