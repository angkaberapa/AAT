# Canonical Store (role=store). PLACEHOLDER satu instance: topologi sharding/replikasi P1
# menggantikan file ini. Data di local-path (hostPath di node), sesuai Ketentuan Tester Agent no. 7.
# Dijalankan sebagai replica set satu anggota (rs0) karena fencing P2 butuh transaksi multi-dokumen;
# topologi P1 apa pun (replica set / sharded cluster) juga harus mendukung transaksi.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels: { app: mongo, role: store }
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo, role: store }
    spec:
      enableServiceLinks: false
      # Replica set + auth wajib punya keyFile (dipakai antar-anggota). Satu anggota: isinya acak
      # per start sudah cukup; milik uid 999 (mongodb) dengan mode 400.
      initContainers:
        - name: keyfile
          image: mongo:7
          command: ["sh", "-c", "head -c 756 /dev/urandom | base64 > /keyfile/key && chown 999:999 /keyfile/key && chmod 400 /keyfile/key"]
          volumeMounts: [{ name: keyfile, mountPath: /keyfile }]
          resources:
            requests: { memory: 32Mi, cpu: 10m }
            limits: { memory: 64Mi }
      containers:
        - name: mongo
          image: mongo:7
          # Cache WiredTiger dibatasi supaya muat di limit 1Gi (bawaannya 50% RAM node).
          args: ["--replSet", "rs0", "--keyFile", "/keyfile/key", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
          lifecycle:
            # Inisialisasi replica set sekali (idempoten). Anggota didaftarkan sebagai localhost;
            # client memakai directConnection=true sehingga tidak bergantung pada nama host itu.
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    for i in $(seq 1 60); do
                      mongosh --quiet -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval '
                        try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]}).ok }
                      ' 2>/dev/null | grep -q 1 && exit 0
                      sleep 2
                    done
                    exit 1
          ports: [{ containerPort: 27017, name: mongo }]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: MONGO_ROOT_USER } }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: MONGO_ROOT_PASSWORD } }
          volumeMounts:
            - { name: data, mountPath: /data/db }
            - { name: keyfile, mountPath: /keyfile }
          readinessProbe:
            # Siap = sudah PRIMARY (bisa menerima tulisan/transaksi), bukan sekadar hidup.
            exec: { command: ["mongosh", "--quiet", "--eval", "quit(db.hello().isWritablePrimary ? 0 : 1)"] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: mongo }
            periodSeconds: 10
          resources:
            requests: { memory: 512Mi, cpu: 100m }
            limits: { memory: 1Gi }
      volumes:
        - name: keyfile
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels: { app: mongo, role: store }
spec:
  selector: { app: mongo }
  ports: [{ name: mongo, port: 27017, targetPort: mongo }]
---
# "Storage dimiliki tepat satu service" ditegakkan platform (Ketentuan Implementasi no. 8):
# hanya pod role=aggregator yang boleh membuka koneksi ke pod role=store.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: store-only-from-aggregator
spec:
  podSelector:
    matchLabels: { role: store }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { role: aggregator }
