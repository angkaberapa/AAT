# BNPB Aggregator (role=aggregator). Service ClusterIP = titik masuk tunggal; hanya pod yang lolos
# readinessProbe yang menerima trafik (P2 kriteria 1).
# replicas sementara 1: tanpa leader election (P2 fase 2) tiap instance akan ikut polling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bnpb-aggregator
  labels: { app: bnpb-aggregator, role: aggregator }
spec:
  replicas: 1
  selector:
    matchLabels: { app: bnpb-aggregator }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: bnpb-aggregator, role: aggregator }
    spec:
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: bnpb-aggregator }
      containers:
        - name: bnpb-aggregator
          image: aat/bnpb-aggregator:dev
          ports: [{ containerPort: 8000, name: http }]
          envFrom: [{ configMapRef: { name: bnpb-aggregator-config } }]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: BMKG_API_KEY
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: BMKG_API_KEY } }
            - name: PVMBG_TOKEN
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: PVMBG_TOKEN } }
            - name: MONGO_ROOT_USER
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: MONGO_ROOT_USER } }
            - name: MONGO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: MONGO_ROOT_PASSWORD } }
            # $(VAR) diekspansi kubelet dari env di atas (MONGO_HOST dari ConfigMap via envFrom).
            - name: MONGO_URI
              value: mongodb://$(MONGO_ROOT_USER):$(MONGO_ROOT_PASSWORD)@$(MONGO_HOST)/?authSource=admin
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { memory: 256Mi, cpu: 250m }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: bnpb-aggregator
  labels: { app: bnpb-aggregator, role: aggregator }
spec:
  selector: { app: bnpb-aggregator }
  ports: [{ name: http, port: 8000, targetPort: http }]
