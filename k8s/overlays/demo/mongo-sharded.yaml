# Full P1 demonstration topology. The six data-bearing Kubernetes nodes must be labelled:
# bnpb.io/physical-host: host-a | host-b | host-c
# bnpb.io/mongo-shard: shard-0 | shard-1
# Each physical host supplies one node for each shard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-replica-bootstrap
data:
  bootstrap.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    # Only ordinal zero initializes its replica set. Other members merely join it.
    case "$HOSTNAME" in
      *-0) ;;
      *) exit 0 ;;
    esac

    auth=(
      -u "$MONGO_ROOT_USER"
      -p "$MONGO_ROOT_PASSWORD"
      --authenticationDatabase admin
    )
    internal_auth=(
      -u __system
      -p "$(cat /keyfile/key)"
      --authenticationDatabase local
    )

    # On a normal restart the replica set and user already exist.
    for _ in $(seq 1 120); do
      if mongosh --quiet --host 127.0.0.1 "${auth[@]}" \
        --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)' >/dev/null 2>&1; then
        exit 0
      fi
      if mongosh --quiet --host 127.0.0.1 "${internal_auth[@]}" \
        --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)' >/dev/null 2>&1; then
        break
      fi
      sleep 2
    done

    mongosh --quiet --host 127.0.0.1 "${internal_auth[@]}" --eval '
      try {
        rs.status().ok;
      } catch (error) {
        const result = rs.initiate(JSON.parse(process.env.REPLICA_CONFIG));
        if (!result.ok && result.codeName !== "AlreadyInitialized") quit(1);
      }
    '

    # The keyfile authenticates members as __system, which can safely create
    # the first administrator on whichever member wins the election.
    primary=""
    until primary="$(mongosh --quiet --host 127.0.0.1 "${internal_auth[@]}" --eval '
      const primary = db.hello().primary;
      if (!primary) quit(1);
      print(primary);
    ' 2>/dev/null)" && [ -n "$primary" ]; do
      sleep 2
    done

    mongosh --quiet --host "$primary" "${internal_auth[@]}" --eval '
      const admin = db.getSiblingDB("admin");
      if (!admin.getUser(process.env.MONGO_ROOT_USER)) {
        admin.createUser({
          user: process.env.MONGO_ROOT_USER,
          pwd: process.env.MONGO_ROOT_PASSWORD,
          roles: [{role: "root", db: "admin"}]
        });
      }
    '
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-config-headless
  labels: { app: mongo-config, role: store }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: mongo-config }
  ports: [{ name: mongo, port: 27017, targetPort: mongo }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-config
  labels: { app: mongo-config, role: store }
spec:
  serviceName: mongo-config-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: mongo-config }
  template:
    metadata:
      labels: { app: mongo-config, role: store }
    spec:
      enableServiceLinks: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: bnpb.io/physical-host
              labelSelector:
                matchLabels: { app: mongo-config }
      initContainers:
        - name: keyfile
          image: mongo:7
          command: ["sh", "-c", "cp /source/key /keyfile/key && chown 999:999 /keyfile/key && chmod 400 /keyfile/key"]
          volumeMounts:
            - { name: key-source, mountPath: /source, readOnly: true }
            - { name: keyfile, mountPath: /keyfile }
          resources:
            requests: { memory: 32Mi, cpu: 10m }
            limits: { memory: 64Mi }
      containers:
        - name: mongo
          image: mongo:7
          args: ["--configsvr", "--port", "27017", "--replSet", "config-rs", "--keyFile", "/keyfile/key", "--bind_ip_all", "--dbpath", "/data/db", "--wiredTigerCacheSizeGB", "0.25"]
          lifecycle:
            postStart:
              exec: { command: ["bash", "/bootstrap/bootstrap.sh"] }
          ports: [{ containerPort: 27017, name: mongo }]
          env:
            - name: MONGO_ROOT_USER
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: MONGO_ROOT_USER } }
            - name: MONGO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: MONGO_ROOT_PASSWORD } }
            - name: REPLICA_CONFIG
              value: '{"_id":"config-rs","configsvr":true,"members":[{"_id":0,"host":"mongo-config-0.mongo-config-headless:27017"},{"_id":1,"host":"mongo-config-1.mongo-config-headless:27017"},{"_id":2,"host":"mongo-config-2.mongo-config-headless:27017"}]}'
          volumeMounts:
            - { name: data, mountPath: /data/db }
            - { name: keyfile, mountPath: /keyfile }
            - { name: bootstrap, mountPath: /bootstrap, readOnly: true }
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  mongosh --quiet -u "$MONGO_ROOT_USER"
                  -p "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin
                  --eval 'const h=db.hello(); quit(h.isWritablePrimary || h.secondary ? 0 : 1)'
            periodSeconds: 5
            timeoutSeconds: 5
          startupProbe:
            tcpSocket: { port: mongo }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket: { port: mongo }
            periodSeconds: 10
          resources:
            requests: { memory: 512Mi, cpu: 100m }
            limits: { memory: 1Gi }
      volumes:
        - name: key-source
          secret:
            secretName: bnpb-secrets
            defaultMode: 0400
            items: [{ key: MONGO_CLUSTER_KEY, path: key }]
        - { name: keyfile, emptyDir: {} }
        - name: bootstrap
          configMap: { name: mongo-replica-bootstrap }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: { requests: { storage: 2Gi } }
---
