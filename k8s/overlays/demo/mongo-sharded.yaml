apiVersion: v1
kind: Service
metadata:
  name: mongo-router
  labels: { app: mongo-router, role: other }
spec:
  selector: { app: mongo-router }
  ports: [{ name: mongo, port: 27017, targetPort: mongo }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-router
  labels: { app: mongo-router, role: other }
spec:
  replicas: 3
  selector:
    matchLabels: { app: mongo-router }
  template:
    metadata:
      labels: { app: mongo-router, role: other }
    spec:
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: bnpb.io/physical-host
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: mongo-router }
      initContainers:
        - name: keyfile
          image: mongo:7
          command: ["sh", "-c", "cp /source/key /keyfile/key && chown 999:999 /keyfile/key && chmod 400 /keyfile/key"]
          volumeMounts:
            - { name: key-source, mountPath: /source, readOnly: true }
            - { name: keyfile, mountPath: /keyfile }
          resources:
            requests: { memory: 32Mi, cpu: 10m }
            limits: { memory: 64Mi }
      containers:
        - name: mongos
          image: mongo:7
          args:
            - mongos
            - --configdb
            - config-rs/mongo-config-0.mongo-config-headless:27017,mongo-config-1.mongo-config-headless:27017,mongo-config-2.mongo-config-headless:27017
            - --keyFile
            - /keyfile/key
            - --bind_ip_all
          ports: [{ containerPort: 27017, name: mongo }]
          env:
            - name: MONGO_ROOT_USER
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: MONGO_ROOT_USER } }
            - name: MONGO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: MONGO_ROOT_PASSWORD } }
          volumeMounts: [{ name: keyfile, mountPath: /keyfile }]
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  mongosh --quiet -u "$MONGO_ROOT_USER" -p "$MONGO_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'
            periodSeconds: 5
            timeoutSeconds: 5
          startupProbe:
            tcpSocket: { port: mongo }
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            tcpSocket: { port: mongo }
            periodSeconds: 10
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 256Mi }
      volumes:
        - name: key-source
          secret:
            secretName: bnpb-secrets
            defaultMode: 0400
            items: [{ key: MONGO_CLUSTER_KEY, path: key }]
        - { name: keyfile, emptyDir: {} }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-bootstrap-v1
  labels: { app: mongo-bootstrap, role: other }
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: { app: mongo-bootstrap, role: other }
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: bootstrap
          image: mongo:7
          env:
            - name: MONGO_ROOT_USER
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: MONGO_ROOT_USER } }
            - name: MONGO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: bnpb-secrets, key: MONGO_ROOT_PASSWORD } }
          command:
            - bash
            - -ceu
            - |
              auth=(-u "$MONGO_ROOT_USER" -p "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin)

              wait_mongo() {
                local host="$1"
                until mongosh --quiet --host "$host" "${auth[@]}" --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)' >/dev/null 2>&1; do
                  sleep 2
                done
              }

              wait_mongo mongo-router
              mongosh --quiet --host mongo-router "${auth[@]}" --eval '
                const ids = db.getSiblingDB("config").shards.find({}, {_id:1}).toArray().map(s => s._id);
                if (!ids.includes("shard-0")) {
                  assert.commandWorked(db.adminCommand({
                    addShard: "shard0-rs/mongo-shard-0-0.mongo-shard-0-headless:27017,mongo-shard-0-1.mongo-shard-0-headless:27017,mongo-shard-0-2.mongo-shard-0-headless:27017",
                    name: "shard-0"
                  }));
                }
                if (!ids.includes("shard-1")) {
                  assert.commandWorked(db.adminCommand({
                    addShard: "shard1-rs/mongo-shard-1-0.mongo-shard-1-headless:27017,mongo-shard-1-1.mongo-shard-1-headless:27017,mongo-shard-1-2.mongo-shard-1-headless:27017",
                    name: "shard-1"
                  }));
                }
                sh.enableSharding("bnpb");
              '

              # Aggregator creates the unique hazard_id index. Wait before enabling sharding.
              until mongosh --quiet --host mongo-router "${auth[@]}" --eval '
                const names=db.getSiblingDB("bnpb").hazard_events.getIndexes().map(i => i.name);
                quit(names.includes("hazard_id_1") ? 0 : 1)
              ' >/dev/null 2>&1; do
                sleep 2
              done

              mongosh --quiet --host mongo-router "${auth[@]}" --eval '
                const ns="bnpb.hazard_events";
                const existing=db.getSiblingDB("config").collections.findOne({_id:ns});
                if (!existing || !existing.key) sh.shardCollection(ns, {hazard_id:1}, true);
                try { sh.splitAt(ns, {hazard_id:"HZ-8"}); } catch (e) { print(e.message); }
                try { sh.moveChunk(ns, {hazard_id:"HZ-4"}, "shard-0"); } catch (e) { print(e.message); }
                try { sh.moveChunk(ns, {hazard_id:"HZ-c"}, "shard-1"); } catch (e) { print(e.message); }
              '
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 256Mi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-router-only-from-owner
spec:
  podSelector:
    matchLabels: { app: mongo-router }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { role: aggregator }
        - podSelector:
            matchLabels: { app: mongo-bootstrap }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-data-only-from-owner-and-cluster
spec:
  podSelector:
    matchLabels: { role: store }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { role: store }
        - podSelector:
            matchLabels: { app: mongo-router }
        - podSelector:
            matchLabels: { role: aggregator }
      ports:
        - { protocol: TCP, port: 27017 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: mongo-config }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: mongo-config } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: mongo-shard-0 }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: mongo-shard-0 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: mongo-shard-1 }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: mongo-shard-1 } }
