apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sistem-informasi-kebencanaan-bnpb
resources:
  - ../../base
  - mongo-sharded.yaml
patches:
  - target: { group: apps, version: v1, kind: StatefulSet, name: mongo }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: mongo
  - target: { version: v1, kind: Service, name: mongo }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: mongo
  - target: { group: apps, version: v1, kind: Deployment, name: bnpb-aggregator }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/7/value
        value: mongodb://$(MONGO_ROOT_USER):$(MONGO_ROOT_PASSWORD)@mongo-router:27017/?authSource=admin
