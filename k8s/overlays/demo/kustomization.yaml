    newTag: "5a5d731"
  - name: aat/bnpb-aggregator
    newName: ghcr.io/angkaberapa/aat-bnpb-aggregator
    newTag: "5a5d731"
  - name: aat/bnpb-api
    newName: ghcr.io/angkaberapa/aat-bnpb-api
    newTag: "5a5d731"
  - name: aat/bnpb-auth
    newName: ghcr.io/angkaberapa/aat-bnpb-auth
    newTag: "5a5d731"
  - name: aat/bnpb-consumer-dashboard
    newName: ghcr.io/angkaberapa/aat-bnpb-consumer-dashboard
