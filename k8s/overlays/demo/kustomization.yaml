apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sistem-informasi-kebencanaan-bnpb
resources:
  - ../../base
  - mongo-sharded.yaml
patches:
  - target: { group: apps, version: v1, kind: StatefulSet, name: mongo }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: mongo
  - target: { version: v1, kind: Service, name: mongo }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: mongo
  - target: { version: v1, kind: ConfigMap, name: bnpb-aggregator-config }
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: bnpb-aggregator-config
      data:
        MONGO_HOST: mongo-router:27017
  # Komponen berstate satu replika (state di PVC local-path yang terikat ke satu node) ditempatkan
  # di node control-plane. Skenario mematikan node hanya dikenakan pada worker non-control-plane
  # (Ketentuan Platform no. 4), jadi state ini tidak ikut hilang bersama worker. Batasan yang
  # disadari: Kafka tetap satu broker; solusi penuh = 3 broker dengan replication factor 3.
  - target: { kind: StatefulSet, name: kafka }
    patch: &pinControlPlane |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { node-role.kubernetes.io/control-plane: "true" }
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
          - { key: node-role.kubernetes.io/master, operator: Exists, effect: NoSchedule }
  - target: { kind: Deployment, name: "^(bnpb-consumer-dashboard|bnpb-consumer-notifier|bnpb-satellite|bnpb-coastal|sensor-pantai)$" }
    patch: *pinControlPlane

# >>> images (scripts/push-images.sh)
images:
